<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИИ-практикум для предпринимателей</title>
<meta name="description" content="Amanzholov University: практикум по Claude и ChatGPT для предпринимателей — готовые запросы на казахском и русском.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F1E8; --paper:#FFFDF9; --ink:#1D1916; --muted:#6E655B; --line:#E8DDCD;
  --claude:#D45A32; --claude-soft:#FBE3D6; --gpt:#E6127A; --gpt-soft:#FDE0EE; --lime:#CFEA1F;
  --shadow:0 1px 2px rgba(29,25,22,.05),0 14px 36px -14px rgba(29,25,22,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15120F; --paper:#201B17; --ink:#F4ECE2; --muted:#B4A898; --line:#3A322B;
  --claude:#F0784F; --claude-soft:#3E2418; --gpt:#FF4F9E; --gpt-soft:#3D1427;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 36px -14px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --bg:#15120F; --paper:#201B17; --ink:#F4ECE2; --muted:#B4A898; --line:#3A322B;
  --claude:#F0784F; --claude-soft:#3E2418; --gpt:#FF4F9E; --gpt-soft:#3D1427;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 0);background-size:22px 22px}
body::before{content:"";position:fixed;right:-6vw;bottom:-8vh;width:min(62vw,560px);aspect-ratio:114/122;background:var(--ink);opacity:.045;
  -webkit-mask:url(assets/amanzholov-logo.svg) center/contain no-repeat;mask:url(assets/amanzholov-logo.svg) center/contain no-repeat;pointer-events:none;z-index:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
h1,h2{font-family:Unbounded,Inter,system-ui,sans-serif;line-height:1.12;margin:0}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0}
.brand{display:flex;align-items:center;gap:10px;line-height:1.3;text-decoration:none}
.brand .logo{width:40px;aspect-ratio:114/86;flex:none;background:var(--ink);-webkit-mask:url(assets/amanzholov-emblem.svg) center/contain no-repeat;mask:url(assets/amanzholov-emblem.svg) center/contain no-repeat}
.brand .name{font:700 15px/1.15 Unbounded,Inter,sans-serif;color:var(--ink)}
.brand .name small{display:block;font:500 12px Inter,sans-serif;color:var(--muted);margin-top:3px}
.lang{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.lang button{border:0;background:transparent;color:var(--ink);font:600 14px Inter,sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer;min-height:40px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.hero{padding:34px 0 8px;max-width:760px}
.kicker{display:inline-block;background:var(--ink);color:var(--bg);font:700 12.5px Inter,sans-serif;letter-spacing:.07em;text-transform:uppercase;padding:7px 12px;border-radius:8px;transform:rotate(-1.5deg)}
.hero h1{font-size:clamp(32px,6vw,60px);font-weight:800;margin:18px 0 14px;letter-spacing:-.015em}
.hero h1 .c{color:var(--claude)} .hero h1 .g{color:var(--gpt)}
.hero p{font-size:clamp(16px,2.2vw,19px);color:var(--muted);margin:0}

.sectors{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:34px 0 0}
.card{--c:var(--claude);--cs:var(--claude-soft);position:relative;display:flex;flex-direction:column;gap:14px;text-decoration:none;color:inherit;
  background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:26px 24px 22px;box-shadow:var(--shadow);overflow:hidden;transition:transform .2s ease}
.card.gpt{--c:var(--gpt);--cs:var(--gpt-soft)}
@media (hover:hover){.card:hover{transform:translateY(-3px)}}
.card:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.card .band{position:absolute;inset:0 0 auto 0;height:8px;background:var(--c)}
.card.gpt .band{background:linear-gradient(90deg,var(--gpt) 0 70%,var(--lime) 70%)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tag{font:700 12px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.count{display:inline-flex;align-items:center;gap:6px;background:var(--cs);color:var(--c);font:700 13px Inter,sans-serif;padding:6px 11px;border-radius:999px}
.card h2{font-size:clamp(24px,3.4vw,32px);font-weight:800}
.card h2 em{font-style:normal;color:var(--c)}
.card p{margin:0;color:var(--muted);font-size:15.5px}
.icons{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.icons span{width:44px;height:44px;border-radius:14px;background:var(--cs);color:var(--c);display:grid;place-items:center}
.icons span svg{width:22px;height:22px}
.card.gpt .icons span:nth-child(odd){outline:2px solid var(--lime);outline-offset:-2px}
.go{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--c);color:#fff;border-radius:14px;padding:13px 16px;font:700 15px Inter,sans-serif;min-height:50px}
.go svg{width:22px;height:22px}

footer{margin:38px 0 44px;font-size:13.5px;color:var(--muted)}
@media (max-width:760px){.sectors{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="brand"><span class="logo" role="img" aria-label="Amanzholov University"></span><span class="name">Amanzholov University<small data-t="org"></small></span></span>
    <div class="lang" role="group" aria-label="Язык / Тіл">
      <button type="button" data-lang="kz" aria-pressed="false">Қазақша</button>
      <button type="button" data-lang="ru" aria-pressed="true">Русский</button>
    </div>
  </div>

  <header class="hero">
    <span class="kicker" data-t="kicker"></span>
    <h1 data-t="title"></h1>
    <p data-t="lead"></p>
  </header>

  <main class="sectors">
    <a class="card" id="cardClaude" href="claude/">
      <span class="band" aria-hidden="true"></span>
      <div class="head"><span class="tag">Claude</span><span class="count" data-t="cCount"></span></div>
      <h2 data-t="cTitle"></h2>
      <p data-t="cText"></p>
      <div class="icons" id="iconsClaude" aria-hidden="true"></div>
      <span class="go"><span data-t="cGo"></span><span class="arr"></span></span>
    </a>
    <a class="card gpt" id="cardGpt" href="chatgpt/">
      <span class="band" aria-hidden="true"></span>
      <div class="head"><span class="tag">ChatGPT</span><span class="count" data-t="gCount"></span></div>
      <h2 data-t="gTitle"></h2>
      <p data-t="gText"></p>
      <div class="icons" id="iconsGpt" aria-hidden="true"></div>
      <span class="go"><span data-t="gGo"></span><span class="arr"></span></span>
    </a>
  </main>

  <footer data-t="foot"></footer>
</div>

<script>
const IC = {
  assistant:'<rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M8.5 14.6l2.3 2.3 4.7-4.7"/>',
  smm:'<path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.8l1.4-2h4.6l1.4 2h1.8A2.5 2.5 0 0 1 20 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.8" r="3.6"/>',
  analyst:'<circle cx="10.5" cy="10.5" r="6.8"/><path d="M15.6 15.6L21 21"/><path d="M7.8 13v-1.6M10.5 13V8.2M13.2 13v-3"/>',
  accountant:'<path d="M5.5 3h13v18l-2.2-1.5-2.1 1.5-2.2-1.5-2.2 1.5-2.1-1.5-2.2 1.5z"/><path d="M9 7.5h6M9 11h6M9 14.5h3.5"/>',
  designer:'<path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7H16a5 5 0 0 0 5-5C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.1"/><circle cx="9.8" cy="7" r="1.1"/><circle cx="14.6" cy="7.2" r="1.1"/>',
  coach:'<rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/>',
  hr:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.6"/><path d="M17 14a5 5 0 0 1 4.5 5"/>',
  lawyer:'<path d="M12 3.5v17M7.5 20.5h9M4.5 7h15"/><path d="M4.5 7L2 13a2.5 2.5 0 0 0 5 0z"/><path d="M19.5 7L17 13a2.5 2.5 0 0 0 5 0z"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/>',
  meetings:'<rect x="3" y="4.5" width="15" height="14" rx="2.5"/><path d="M3 9h15M7.5 2.5v4M13.5 2.5v4"/><circle cx="17.5" cy="17" r="4.2"/><path d="M17.5 15.2v2l1.3 1"/>',
  sales:'<path d="M4 20.5h16"/><path d="M6.5 17v-3M11 17v-6M15.5 17v-4.5"/><path d="M5 10.5l5-4 3.5 2.5 6-5"/><path d="M15.8 4h3.7v3.7"/>',
  docs:'<path d="M14 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8z"/><path d="M14 3v5h5"/><path d="M8.5 12.5h7M8.5 16h5"/>',
  report:'<rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9.5 2.8h5v2.6h-5z"/><path d="M8.5 10.7l1.2 1.2 2.3-2.3M8.5 16.2l1.2 1.2 2.3-2.3M14 11h2M14 16.5h2"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'
};
const svg = k => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+IC[k]+'</svg>';

const UI = {
  ru:{ org:"Цифровой офис", kicker:"Практикум для предпринимателей",
    title:'ИИ для бизнеса:<br><span class="c">Claude</span> и <span class="g">ChatGPT</span>',
    lead:"Выберите раздел: готовые запросы на казахском и русском, пошаговые инструкции и учебные файлы. Всё можно попробовать прямо с телефона.",
    cCount:"8 сотрудников", cTitle:"Ты — CEO.<br><em>Claude</em> — твоя команда", cText:"Ассистент, СММ-менеджер, аналитик, бухгалтер, дизайнер, бизнес-тренер, HR и помощник юриста.", cGo:"Открыть практикум Claude",
    gCount:"8 сценариев", gTitle:"<em>ChatGPT</em> для бизнеса", gText:"Утренний брифинг, почта, встречи, продажи, документы, клиенты, конкуренты и отчёт за неделю.", gGo:"Открыть практикум ChatGPT",
    foot:"© 2026 Amanzholov University · Цифровой офис. Все компании и данные в учебных файлах вымышлены." },
  kz:{ org:"Цифрлық офис", kicker:"Кәсіпкерлерге арналған практикум",
    title:'Бизнеске арналған ЖИ:<br><span class="c">Claude</span> және <span class="g">ChatGPT</span>',
    lead:"Бөлімді таңдаңыз: қазақ және орыс тілдеріндегі дайын сұраулар, қадамдық нұсқаулар және оқу файлдары. Бәрін телефоннан бірден байқап көруге болады.",
    cCount:"8 қызметкер", cTitle:"Сен — CEO.<br><em>Claude</em> — сенің командаң", cText:"Ассистент, СММ-менеджер, талдаушы, бухгалтер, дизайнер, бизнес-жаттықтырушы, HR және заңгер көмекшісі.", cGo:"Claude практикумын ашу",
    gCount:"8 тәсіл", gTitle:"<em>ChatGPT</em> бизнес үшін", gText:"Таңғы шолу, пошта, кездесулер, сатылым, құжаттар, клиенттер, бәсекелестер және апталық есеп.", gGo:"ChatGPT практикумын ашу",
    foot:"© 2026 Amanzholov University · Цифрлық офис. Оқу файлдарындағы барлық компаниялар мен деректер ойдан шығарылған." }
};

let lang = "ru";
try { const q = new URLSearchParams(location.search).get("lang"); if (q==="kz"||q==="ru") lang=q; else { const s=localStorage.getItem("biz-lang"); if (s==="kz"||s==="ru") lang=s; } } catch(e){}

function render(){
  const u = UI[lang];
  document.documentElement.lang = lang==="kz" ? "kk" : "ru";
  document.title = lang==="kz" ? "Кәсіпкерлерге арналған ЖИ-практикум" : "ИИ-практикум для предпринимателей";
  document.querySelectorAll("[data-t]").forEach(el=>{ el.innerHTML = u[el.dataset.t]; });
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  document.getElementById("cardClaude").href = "claude/?lang="+lang;
  document.getElementById("cardGpt").href = "chatgpt/?lang="+lang;
  document.getElementById("iconsClaude").innerHTML = ["assistant","smm","analyst","accountant","designer","coach","hr","lawyer"].map(k=>"<span>"+svg(k)+"</span>").join("");
  document.getElementById("iconsGpt").innerHTML = ["assistant","mail","meetings","sales","docs","hr","analyst","report"].map(k=>"<span>"+svg(k)+"</span>").join("");
  document.querySelectorAll(".arr").forEach(a=>a.innerHTML=svg("arrow"));
}
document.addEventListener("click", e=>{
  const lb = e.target.closest(".lang button");
  if (lb){ lang = lb.dataset.lang; try{ localStorage.setItem("biz-lang",lang); }catch(err){} render(); }
});
render();
</script>
</body>
</html>
