<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatGPT для бизнеса</title>
<meta name="description" content="Практикум для предпринимателей: 8 сценариев автоматизации ChatGPT с готовыми запросами на казахском и русском.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F1E8; --paper:#FFFDF9; --ink:#1D1916; --muted:#6E655B; --line:#E8DDCD;
  --accent:#D45A32; --accent-2:#E98A5E; --accent-soft:#FBE3D6;
  --gold:#B7821C; --gold-soft:#F6E7C4; --free:#2E7A4C; --free-soft:#DCEFE2;
  --code:#24201C; --code-2:#2F2925; --code-ink:#F7EFE5;
  --t1:#D45A32; --t1s:#FBE3D6; --t2:#C2407A; --t2s:#F9DDE9; --t3:#2F6FB3; --t3s:#DCE8F6;
  --t4:#2E7A4C; --t4s:#DCEFE2; --t5:#8A4FC2; --t5s:#EADFF6; --t6:#C77A12; --t6s:#F8E6C8;
  --t7:#13858A; --t7s:#D5EFEF; --t8:#5B5249; --t8s:#ECE6DE;
  --shadow:0 1px 2px rgba(29,25,22,.05),0 10px 30px -12px rgba(29,25,22,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15120F; --paper:#201B17; --ink:#F4ECE2; --muted:#B4A898; --line:#3A322B;
  --accent:#F0784F; --accent-2:#F59A72; --accent-soft:#3E2418; --gold:#E3B657; --gold-soft:#3A2E15;
  --free:#6CCB90; --free-soft:#173022; --code:#0F0C0A; --code-2:#1A1512; --code-ink:#F7EFE5;
  --t1:#F0784F; --t1s:#3E2418; --t2:#EE79AE; --t2s:#3D1B2B; --t3:#78AEEA; --t3s:#18283B;
  --t4:#6CCB90; --t4s:#173022; --t5:#BD95EC; --t5s:#2C1E3D; --t6:#EDB25A; --t6s:#3A2A12;
  --t7:#5FCBCF; --t7s:#123234; --t8:#C9BEB1; --t8s:#2E2823;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px -12px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#15120F; --paper:#201B17; --ink:#F4ECE2; --muted:#B4A898; --line:#3A322B;
  --accent:#F0784F; --accent-2:#F59A72; --accent-soft:#3E2418; --gold:#E3B657; --gold-soft:#3A2E15;
  --free:#6CCB90; --free-soft:#173022; --code:#0F0C0A; --code-2:#1A1512; --code-ink:#F7EFE5;
  --t1:#F0784F; --t1s:#3E2418; --t2:#EE79AE; --t2s:#3D1B2B; --t3:#78AEEA; --t3s:#18283B;
  --t4:#6CCB90; --t4s:#173022; --t5:#BD95EC; --t5s:#2C1E3D; --t6:#EDB25A; --t6s:#3A2A12;
  --t7:#5FCBCF; --t7s:#123234; --t8:#C9BEB1; --t8s:#2E2823;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 0);background-size:22px 22px}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:Unbounded,Inter,system-ui,sans-serif;line-height:1.12;margin:0}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0}
.brand{text-decoration:none;display:flex;align-items:center;gap:10px;line-height:1.3}
.brand .logo{width:40px;aspect-ratio:114/86;flex:none;background:var(--ink);-webkit-mask:url(../assets/amanzholov-emblem.svg) center/contain no-repeat;mask:url(../assets/amanzholov-emblem.svg) center/contain no-repeat}
.brand .name{font:700 15px/1.15 Unbounded,Inter,sans-serif;color:var(--ink);letter-spacing:.01em}
.brand .name small{display:block;font:500 12px Inter,sans-serif;color:var(--muted);letter-spacing:0;margin-top:3px}
body::before{content:"";position:fixed;right:-6vw;bottom:-8vh;width:min(62vw,560px);aspect-ratio:114/122;background:var(--ink);opacity:.045;-webkit-mask:url(../assets/amanzholov-logo.svg) center/contain no-repeat;mask:url(../assets/amanzholov-logo.svg) center/contain no-repeat;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1}
.lang{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.lang button{border:0;background:transparent;color:var(--ink);font:600 14px Inter,sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer;min-height:40px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ChatGPT theme */
body.gpt{--accent:#E6127A;--accent-2:#FF5FA8;--accent-soft:#FDE0EE;--lime:#CFEA1F;--t9:#E6127A;--t9s:#FDE0EE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.gpt{--accent:#FF4F9E;--accent-2:#FF7DB8;--accent-soft:#3D1427;--t9:#FF5FA8;--t9s:#3D1427}}
:root[data-theme="dark"] body.gpt{--accent:#FF4F9E;--accent-2:#FF7DB8;--accent-soft:#3D1427;--t9:#FF5FA8;--t9s:#3D1427}
.gpt .avatar .no{background:var(--lime);color:#1D1916}
.gpt .hero h1 em{isolation:isolate}
.gpt .hero h1 em::after{background:var(--lime);opacity:1;height:.24em;bottom:.04em;z-index:-1}
.gpt .sec h2{background:linear-gradient(transparent 60%,var(--lime) 60%,var(--lime) 90%,transparent 90%);display:inline}
.gpt .orbit .node circle{stroke:var(--lime)}

/* sector switch */
.sector{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:4px;max-width:420px;box-shadow:var(--shadow)}
.sector a{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:12px;text-decoration:none;color:var(--muted);font:700 15px Unbounded,Inter,sans-serif}
.sector a.on{background:var(--ink);color:var(--bg)}
.sector .sd{width:10px;height:10px;border-radius:50%}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center;padding:22px 0 10px}
.kicker{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;font:700 12.5px Inter,sans-serif;letter-spacing:.07em;text-transform:uppercase;padding:7px 12px;border-radius:8px;transform:rotate(-1.5deg)}
.kicker svg{width:16px;height:16px}
.hero h1{font-size:clamp(34px,6.4vw,66px);font-weight:800;margin:18px 0 14px;letter-spacing:-.015em}
.hero h1 em{font-style:normal;color:var(--accent);position:relative;white-space:nowrap}
.hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:.02em;height:.16em;background:var(--accent);opacity:.18;border-radius:4px}
.hero p{font-size:clamp(16px,2.2vw,19px);color:var(--muted);max-width:560px;margin:0}
.orbit{width:100%;max-width:420px;justify-self:center;aspect-ratio:1}
.orbit svg{width:100%;height:100%;overflow:visible}
.orbit .ring{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 7}
.orbit .spoke{stroke:var(--line);stroke-width:1.5}
.orbit .node circle{stroke:var(--paper);stroke-width:4}
.orbit .core{fill:var(--ink)}
.orbit .core-t{fill:var(--bg);font:800 17px Unbounded,sans-serif;text-anchor:middle}
.orbit .core-s{fill:var(--bg);opacity:.7;font:600 10px Inter,sans-serif;text-anchor:middle;letter-spacing:.12em}
@media (prefers-reduced-motion:no-preference){
  .orbit .spin{transform-origin:200px 200px;animation:spin 90s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
}

/* start */
.start{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0 10px}
.step{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.step b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 14px Unbounded,sans-serif}
.step span{font-size:14.5px;line-height:1.4}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;margin:14px 0 0;font-size:14px;color:var(--muted);align-items:center}
.legend>span{display:inline-flex;align-items:center;gap:8px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font:700 12px Inter,sans-serif;padding:5px 10px 5px 7px;border-radius:999px;white-space:nowrap}
.chip svg{width:15px;height:15px}
.chip.free{background:var(--free-soft);color:var(--free)}
.chip.pro{background:var(--gold-soft);color:var(--gold)}
.chip.pro svg{fill:currentColor;stroke:none}

/* section title */
.sec{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:46px 0 16px}
.sec h2{font-size:clamp(22px,3.4vw,30px);font-weight:700}
.sec p{margin:0;color:var(--muted);font-size:14.5px}

/* team grid */
.team{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;align-items:start}
.badge{--c:var(--t1);--cs:var(--t1s);background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease}
.badge::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--c)}
.badge .clip{position:absolute;top:14px;left:50%;width:46px;height:8px;margin-left:-23px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
@media (hover:hover){.badge:not([open]):hover{transform:translateY(-2px)}}
.badge summary{list-style:none;cursor:pointer;padding:34px 20px 18px;display:grid;grid-template-columns:60px 1fr;gap:3px 16px;align-items:start}
.badge summary::-webkit-details-marker{display:none}
.badge summary:focus-visible{outline:2px solid var(--c);outline-offset:-4px;border-radius:20px}
.avatar{grid-row:span 3;width:60px;height:60px;border-radius:18px;background:var(--cs);color:var(--c);display:grid;place-items:center;position:relative}
.avatar svg{width:30px;height:30px;stroke-width:1.7}
.avatar .no{position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;font:700 11px Unbounded,sans-serif;display:grid;place-items:center;border:3px solid var(--paper)}
.role-label{font-size:11.5px;color:var(--c);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.badge h3{font-size:18.5px;font-weight:700}
.hook{font-size:15px;color:var(--muted);margin-top:2px;line-height:1.45}
.meta{grid-column:2;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.toggle{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:600;color:var(--c)}
.toggle svg{width:18px;height:18px;transition:transform .2s}
.badge[open] .toggle svg,.bonus[open] .toggle svg{transform:rotate(180deg)}
details[open] .toggle .o{display:none}
details:not([open]) .toggle .c{display:none}

.body{padding:2px 20px 22px;border-top:1px dashed var(--line)}
.body h4{display:flex;align-items:center;gap:8px;font:700 12px Inter,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 10px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 12px 40px;font-size:15px;line-height:1.5}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;background:var(--cs);color:var(--c);font:700 12px Unbounded,sans-serif;display:grid;place-items:center}
.steps li:not(:last-child)::after{content:"";position:absolute;left:12.5px;top:28px;bottom:2px;width:1.5px;background:var(--line)}
.dl{display:inline-flex;align-items:center;gap:10px;margin:4px 0 0;background:var(--cs);color:var(--c);text-decoration:none;font-weight:600;font-size:14.5px;padding:10px 16px 10px 12px;border-radius:12px;min-height:46px}
.dl svg{width:20px;height:20px}
.prompt{border-radius:16px;overflow:hidden;background:var(--code);color:var(--code-ink)}
.prompt-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 14px;background:var(--code-2)}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:#5a514a}
.dots i:first-child{background:var(--c)}
.copy{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--c);color:#fff;font:700 13.5px Inter,sans-serif;padding:9px 14px;border-radius:10px;cursor:pointer;min-height:40px}
.copy svg{width:17px;height:17px}
.copy.done{background:var(--free)}
.ptext{display:block;padding:14px 16px 16px;font:14.5px/1.6 Inter,system-ui,sans-serif;white-space:pre-wrap;word-break:break-word}
.note{display:flex;gap:10px;margin-top:12px;font-size:14px;color:var(--muted);background:var(--bg);border-radius:12px;padding:12px 14px;line-height:1.5}
.note svg{width:20px;height:20px;color:var(--c);margin-top:1px}
.note b{color:var(--ink)}
.pro-extra{display:flex;gap:10px;margin-top:10px;font-size:14px;background:var(--gold-soft);border-radius:12px;padding:12px 14px;line-height:1.5}
.pro-extra svg{width:18px;height:18px;color:var(--gold);fill:currentColor;stroke:none;margin-top:2px}

/* bonus */
.bonus{--c:var(--accent-2);--cs:rgba(255,255,255,.1);margin:28px 0 0;background:var(--ink);color:var(--bg);border-radius:24px;overflow:hidden;position:relative;box-shadow:var(--shadow)}
.bonus .glow{position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 55%,transparent),transparent 70%);opacity:.55;pointer-events:none}
.bonus summary{list-style:none;cursor:pointer;padding:24px 22px;display:grid;grid-template-columns:60px 1fr;gap:3px 16px;align-items:start;position:relative}
.bonus summary::-webkit-details-marker{display:none}
.bonus .avatar{background:rgba(255,255,255,.1);color:var(--accent-2)}
.bonus .role-label{color:var(--accent-2)}
.bonus h3{font-size:20px}
.bonus .hook{color:inherit;opacity:.75}
.bonus .body{border-top:1px dashed rgba(255,255,255,.18);position:relative}
.bonus .body h4{color:inherit;opacity:.65}
.bonus .steps li::before{background:rgba(255,255,255,.12);color:var(--accent-2)}
.bonus .steps li:not(:last-child)::after{background:rgba(255,255,255,.15)}
.bonus .dl{background:var(--accent);color:#fff}
.bonus .prompt{background:rgba(0,0,0,.35)}
.bonus .prompt-bar{background:rgba(0,0,0,.25)}
.bonus .copy{background:var(--accent)}
.bonus .note{background:rgba(255,255,255,.07);color:inherit}
.bonus .note b{color:inherit}
.bonus .toggle{color:var(--accent-2)}

footer{margin:34px 0 44px}
.warn{display:flex;gap:12px;background:var(--accent-soft);border-radius:16px;padding:16px 18px;color:var(--ink);font-size:14.5px;line-height:1.5}
.warn svg{width:24px;height:24px;color:var(--accent)}
.foot{margin-top:14px;font-size:13.5px;color:var(--muted)}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .orbit{max-width:280px;order:2;margin-top:8px}
  .start{grid-template-columns:1fr}
  .team{grid-template-columns:1fr}
  .sec{flex-direction:column;align-items:start}
}

/* forum materials */
.forum{display:flex;align-items:center;gap:22px;margin:0 0 16px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.forum .qr{flex:none;width:150px;height:150px;background:#fff;border-radius:14px;padding:8px;border:1px solid var(--line)}
.forum .qr img{width:100%;height:100%;display:block;image-rendering:pixelated}
.forum h2{color:var(--ink);font:700 clamp(20px,3vw,26px)/1.15 Unbounded,Inter,sans-serif;margin:0 0 6px}
.forum p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.forum a.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);text-decoration:none;font:700 14.5px Inter,sans-serif;padding:11px 16px;border-radius:12px;min-height:46px}
.forum a.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:560px){.forum{flex-direction:column;text-align:center}.forum .qr{width:180px;height:180px}}
</style>
</head>
<body class="gpt">
<div class="wrap">
  <div class="top">
    <a class="brand" id="home" href="../"><span class="logo" role="img" aria-label="Amanzholov University"></span><span class="name">Amanzholov University<small data-t="org"></small></span></a>
    <div class="lang" role="group" aria-label="Язык / Тіл">
      <button type="button" data-lang="kz" aria-pressed="false">Қазақша</button>
      <button type="button" data-lang="ru" aria-pressed="true">Русский</button>
    </div>
  </div>

  <nav class="sector" aria-label="Раздел">
    <a id="toClaude" href="../claude/"><span class="sd" style="background:#D45A32"></span>Claude</a>
    <a id="toGpt" class="on" href="../chatgpt/"><span class="sd" style="background:#E6127A"></span>ChatGPT</a>
  </nav>

  <header class="hero">
    <div>
      <span class="kicker"><span id="kickIcon"></span><span data-t="kicker"></span></span>
      <h1 data-t="title"></h1>
      <p data-t="lead"></p>
    </div>
    <div class="orbit" id="orbit" aria-hidden="true"></div>
  </header>

  <section class="start">
    <div class="step"><b>1</b><span data-t="s1"></span></div>
    <div class="step"><b>2</b><span data-t="s2"></span></div>
    <div class="step"><b>3</b><span data-t="s3"></span></div>
  </section>
  <div class="legend" id="legend"></div>

  <div class="sec"><h2 data-t="teamTitle"></h2><p data-t="teamSub"></p></div>
  <main class="team" id="team"></main>

  <details class="bonus" id="bonus"></details>

  <footer>
    <section class="forum" aria-labelledby="forumTitle"><div class="qr"><img src="../assets/qr-materialy-foruma.png" alt="QR-код: Материалы форума" width="150" height="150"></div><div><h2 id="forumTitle" data-t="forumTitle">Материалы форума</h2><p data-t="forumText">Отсканируйте QR-код или нажмите кнопку, чтобы открыть папку с материалами.</p><a class="btn" href="https://drive.google.com/drive/folders/1X_bZAd-pgAKLCd5cETX8Axdwv9ubsPRH?usp=sharing" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4l2 2.5h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg><span data-t="forumBtn">Открыть папку</span></a></div></section>
    <div class="warn" id="warn"></div>
    <div class="foot" data-t="foot"></div>
  </footer>
</div>

<script>
/* ---------- Vector icons (24×24, stroke) ---------- */
const IC = {
  assistant:'<rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M8.5 14.6l2.3 2.3 4.7-4.7"/>',
  smm:'<path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.8l1.4-2h4.6l1.4 2h1.8A2.5 2.5 0 0 1 20 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.8" r="3.6"/><path d="M17 9.3h.01"/>',

let lang = "ru";
try { const q = new URLSearchParams(location.search).get("lang"); if (q==="kz"||q==="ru") lang=q; else { const s=localStorage.getItem("biz-lang"); if (s==="kz"||s==="ru") lang=s; } } catch(e){}

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const tintVars = n => 'style="--c:var(--t'+n+');--cs:var(--t'+n+'s)"';
const stepsHTML = arr => '<ol class="steps">'+arr.map(s=>"<li>"+s+"</li>").join("")+"</ol>";
const promptHTML = (p,u) => '<div class="prompt"><div class="prompt-bar"><span class="dots"><i></i><i></i><i></i></span><button type="button" class="copy">'+svg("copy")+'<span>'+u.copy+'</span></button></div><span class="ptext">'+esc(p)+'</span></div>';
const tierChip = (t,u) => t==="pro" ? '<span class="chip pro">'+svg("star")+u.proName+'</span>' : '<span class="chip free">'+svg("check")+u.free+'</span>';

function orbit(u){
  const cx=200, cy=200, R=148;
  let spokes="", nodes="";
  ROLES.forEach((r,i)=>{
    const a = -Math.PI/2 + i*2*Math.PI/ROLES.length;
    const x = cx + R*Math.cos(a), y = cy + R*Math.sin(a);
    spokes += '<line class="spoke" x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>';
    nodes += '<g class="node" style="color:var(--t'+r.tint+')"><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="30" fill="var(--t'+r.tint+'s)"/>'+
      '<g transform="translate('+(x-14).toFixed(1)+','+(y-14).toFixed(1)+') scale(1.1667)"><g transform="rotate(0)" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+IC[r.id]+'</g></g></g>';
  });
  return '<svg viewBox="0 0 400 400" role="img">'+
    '<circle class="ring" cx="200" cy="200" r="148"/><circle class="ring" cx="200" cy="200" r="92"/>'+
    spokes+nodes+
    '<circle class="core" cx="200" cy="200" r="58"/>'+
    '<g transform="translate(186,160) scale(1.1667)" fill="none" stroke="var(--accent-2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+IC[u.coreIcon||"crown"]+'</g>'+
    '<text class="core-t" x="200" y="214">'+u.you+'</text><text class="core-s" x="200" y="232">'+(u.youSub||"CEO")+'</text></svg>';
}

function render(){
  const u = UI[lang];
  document.documentElement.lang = lang==="kz" ? "kk" : "ru";
  document.querySelectorAll("[data-t]").forEach(el=>{ el.innerHTML = u[el.dataset.t]; });
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  document.title = u.pageTitle || (lang==="kz" ? "Claude — сенің командаң" : "Claude — твоя команда");
  document.getElementById("kickIcon").innerHTML = svg("bulb");
  document.getElementById("orbit").innerHTML = orbit(u);
  const q='?lang='+lang; document.getElementById('home').href='../'+q; document.getElementById('toClaude').href='../claude/'+q; document.getElementById('toGpt').href='../chatgpt/'+q;
  document.getElementById("legend").innerHTML =
    '<span>'+tierChip("free",u)+u.freeTxt+'</span><span>'+tierChip("pro",u)+u.proTxt+'</span>';
  document.getElementById("warn").innerHTML = svg("shield")+'<div>'+u.warn+'</div>';

  const openIds = new Set([...document.querySelectorAll("details[open]")].map(d=>d.id));
  document.getElementById("team").innerHTML = ROLES.map((r,i)=>{
    const t = r[lang];
    return '<details class="badge" id="'+r.id+'" '+tintVars(r.tint)+'><span class="clip" aria-hidden="true"></span><summary>'+
      '<div class="avatar" aria-hidden="true">'+svg(r.id)+'<span class="no">'+(i+1)+'</span></div>'+
      '<div class="role-label">'+t.label+'</div>'+
      '<h3>'+t.name+'</h3>'+
      '<div class="hook">'+t.hook+'</div>'+
      '<div class="meta">'+tierChip(r.tier,u)+'<span class="toggle"><span class="o">'+u.open+'</span><span class="c">'+u.close+'</span>'+svg("chevron")+'</span></div>'+
      '</summary><div class="body">'+
      '<h4>'+svg("list")+u.steps+'</h4>'+stepsHTML(t.steps)+
      (r.file ? '<a class="dl" href="'+r.file+'" download>'+svg("download")+u.file+'</a>' : '')+
      '<h4>'+svg("chat")+u.task+'</h4>'+promptHTML(t.prompt,u)+
      (t.note ? '<div class="note">'+svg("bulb")+'<div>'+t.note+'</div></div>' : '')+
      (t.extra ? '<div class="pro-extra">'+svg("star")+'<div>'+t.extra+'</div></div>' : '')+
      '</div></details>';
  }).join("");

  const b = BONUS[lang];
  document.getElementById("bonus").innerHTML = '<span class="glow" aria-hidden="true"></span><summary>'+
    '<div class="avatar" aria-hidden="true">'+svg("bonus")+'</div>'+
    '<div class="role-label">'+b.label+'</div><h3>'+b.name+'</h3><div class="hook">'+b.hook+'</div>'+
    '<div class="meta"><span></span><span class="toggle"><span class="o">'+u.open+'</span><span class="c">'+u.close+'</span>'+svg("chevron")+'</span></div></summary>'+
    '<div class="body"><h4>'+svg("list")+b.stepsTitle+'</h4>'+stepsHTML(b.steps)+
    (BONUS.file ? '<a class="dl" href="'+BONUS.file+'" download>'+svg("download")+u.file+' (ZIP)</a>' : '')+
    '<h4>'+svg("chat")+b.task+'</h4>'+promptHTML(b.prompt,u)+
    '<div class="note">'+svg("bulb")+'<div>'+b.note+'</div></div></div>';

  openIds.forEach(id=>{ const d=document.getElementById(id); if(d) d.open=true; });
}

document.addEventListener("click", e=>{
  const lb = e.target.closest(".lang button");
  if (lb){ lang = lb.dataset.lang; try{ localStorage.setItem("biz-lang",lang); }catch(err){} render(); return; }
  const cb = e.target.closest(".copy");
  if (cb){
    const text = cb.closest(".prompt").querySelector(".ptext").textContent;
    const label = cb.querySelector("span");
    const ok = ()=>{ label.textContent = UI[lang].copied; cb.firstChild.outerHTML = svg("done"); cb.classList.add("done");
      setTimeout(()=>{ label.textContent = UI[lang].copy; cb.firstChild.outerHTML = svg("copy"); cb.classList.remove("done"); },1800); };
    const fallback = ()=>{ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); ok();}catch(err){} ta.remove(); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
  }
});

render();
if (location.hash){ const d=document.getElementById(location.hash.slice(1)); if(d&&d.tagName==="DETAILS"){ d.open=true; } }
</script>
</body>
</html>
